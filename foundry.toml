[profile.default]
src = "contracts"
test = "test"
libs = ["lib", "node_modules"]
solc = "0.8.24"
evm_version = "cancun"   # غيّرها لـ paris/shanghai لو الـ chain مش بتدعم Cancun
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512
